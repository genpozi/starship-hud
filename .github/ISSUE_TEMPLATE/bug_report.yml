name: Bug report
description: Something is broken or misbehaving in STELLARIS-7
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report. Before you start, search
        open/closed issues to see if it has already been reported.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened?
      placeholder: Describe the bug in one or two sentences.
    validations:
      required: true

  - type: input
    id: mode
    attributes:
      label: Runtime mode
      description: ONLINE (orbit server), OFFLINE sim, or Docker?
      placeholder: e.g. ONLINE with mock hermes, OFFLINE, Docker compose
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Commit hash or tag you are running
      placeholder: e.g. 1d91970
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact steps that trigger the bug.
      value: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened instead?
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / console errors
      description: Paste browser console errors, server logs, or screenshots if applicable.
    validations:
      required: false

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Browser + version, OS, Node version (if relevant)
      placeholder: e.g. Chrome 130 / Linux / Node v22.22.0
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submit checklist
      options:
        - label: "Reproduced on the latest `master`"
          required: false
        - label: "`npm test` passes on my machine"
          required: false
